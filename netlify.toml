# Netlify Root Configuration
# Handles repo where Astro project is inside /DBT-2026

[build]
  base = "DBT-2026"
  command = "npm run build"
  publish = "DBT-2026/dist"

[build.environment]
  NODE_VERSION = "20"

# Security & Cache Optimization Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/03_photo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/02_design/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/include/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
